[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-trigger-guard"
version = "0.1.0"
description = "Experimental post-verification trigger guard with literal text egress checks for vLLM and MTP"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "johntnk"}]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing",
]

[project.optional-dependencies]
server = ["fastapi>=0.115,<1", "pydantic>=2,<3", "uvicorn>=0.30,<1", "anyio>=4,<5", "prometheus-client>=0.21,<1"]
test = ["fastapi>=0.115,<1", "pydantic>=2,<3", "uvicorn>=0.30,<1", "anyio>=4,<5", "prometheus-client>=0.21,<1", "httpx>=0.27,<1"]

[project.urls]
Homepage = "https://github.com/johntnk/vllm-trigger-guard"
Issues = "https://github.com/johntnk/vllm-trigger-guard/issues"

[project.scripts]
trigger-guard = "trigger_guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trigger_guard = ["patches/*.patch", "patches/*.json"]
